<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1920 1080"
     preserveAspectRatio="none">

  <!--
    このSVGの白い部分(fill="#fff")がリボンの穴になる。
    mask-composite: exclude と組み合わせて使用するため、
    白 = 切り抜かれる部分（動画が見える）
    背景の透明部分 = 黒い覆いとして残る
  -->

  <!-- リボン形状: 波打つ帯が画面を斜めに横切る -->
  <path
    d="
      M-100,350
      C200,280 400,450 600,380
      C800,310 900,500 1100,420
      C1300,340 1500,520 1700,440
      C1900,360 2020,480 2020,480
      L2020,620
      C1900,700 1700,530 1500,610
      C1300,690 1100,510 900,590
      C800,670 600,490 400,570
      C200,650 -100,500 -100,500
      Z
    "
    fill="#ffffff"
  />
</svg>
