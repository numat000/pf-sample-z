<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1920 1080"
     preserveAspectRatio="none">

  <!--
    反転リボンマスク
    白部分 = ribbon-mask-layer の黒背景が表示される（覆い）
    穴（空洞）= リボン形状 → 背景が非表示 → 下の動画が透ける
    
    仕組み: 全面白の rect + リボン形状を clip で除去
    → fill-rule="evenodd" でリボン部分が穴になる
  -->

  <path
    fill-rule="evenodd"
    d="
      M0,0 L1920,0 L1920,1080 L0,1080 Z

      M-50,280
      L180,310
      L260,180
      L480,340
      L560,220
      L740,380
      L850,250
      L980,400
      L1080,290
      L1200,430
      L1340,300
      L1480,460
      L1580,340
      L1720,480
      L1820,370
      L1970,500

      L1970,620
      L1820,540
      L1720,660
      L1580,510
      L1480,640
      L1340,480
      L1200,610
      L1080,460
      L980,580
      L850,430
      L740,560
      L560,400
      L480,520
      L260,370
      L180,490
      L-50,420
      Z
    "
    fill="#ffffff"
  />
</svg>
